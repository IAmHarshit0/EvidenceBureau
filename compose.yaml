services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: evidence-bureau-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen3.5:4b}
      EMBED_MODEL_NAME: ${EMBED_MODEL_NAME:-all-MiniLM-L6-v2}
      RERANKER_MODEL_NAME: ${RERANKER_MODEL_NAME:-BAAI/bge-reranker-base}
      HF_TOKEN: ${HF_TOKEN}
      CHROMA_DB_PATH: /app/data/db
    volumes:
      - ./data/db:/app/data/db
      - ./data/uploads:/app/data/uploads
      - ./data/telemetry:/app/data/telemetry
      - ./data/huggingface:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: evidence-bureau-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped
