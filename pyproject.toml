[project]
name = "evidence-bureau"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "IAmHarshit0", email = "iamharshit237@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "huggingface-hub>=1.27.0",
    "langchain>=1.3.15",
    "langchain-text-splitters>=1.1.2",
    "ollama>=0.6.2",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "sentence-transformers>=5.7.0",
]

[project.scripts]
evidence-bureau = "evidence_bureau:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = "."
